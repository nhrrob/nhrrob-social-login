<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
	html, body { margin: 0; }
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
	.banner { position: relative; overflow: hidden; width: 772px; height: 250px; color: #fff;
		background: linear-gradient(120deg, #312e81 0%, #4f46e5 55%, #8b5cf6 100%); }
	.glow { position: absolute; border-radius: 50%; background: #fff; opacity: .06; }
	.text { position: absolute; left: 44px; top: 40px; width: 330px; }
	.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
	.brand svg { width: 38px; height: 38px; }
	h1 { margin: 20px 0 0; font-size: 29px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
	p { margin: 16px 0 0; font-size: 13.5px; opacity: .9; }
	.card { position: absolute; right: 48px; top: 30px; width: 270px; padding: 16px 18px; border-radius: 14px;
		background: #fff; color: #1d2327; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
	.h { font-size: 14px; font-weight: 700; }
	.btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 10px; padding: 9px 10px;
		border: 1px solid #747775; border-radius: 4px; font-size: 12.5px; font-weight: 600; color: #1f1f1f; }
	.btn i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #4f46e5; box-sizing: border-box; }
	.or { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #8a8f98; }
	.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid #e3e5ea; }
	.field { height: 22px; margin-top: 8px; border: 1px solid #dfe2e8; border-radius: 5px; background: #fafbfc; }
	.field.tall { height: 40px; }
</style></head>
<body>
<div class="banner">
	<div class="glow" style="width:420px;height:420px;right:-120px;top:-170px"></div>
	<div class="glow" style="width:260px;height:260px;right:170px;top:150px"></div>
	<div class="text">
		<div class="brand">
			<svg viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#fff" fill-opacity=".16"/><circle cx="152" cy="104" r="46" fill="none" stroke="#fff" stroke-width="22"/><circle cx="152" cy="104" r="10" fill="#fff"/><path d="M118 138 L62 194 M62 194 L62 214 M62 194 L86 194 M88 168 L108 188" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/></svg>
			NHR Social Login
		</div>
		<h1>Log in, and comment, with a Google account</h1>
		<p>No passwords · No bot sign-ups · Light and dark</p>
	</div>
	<div class="card">
		<div class="h">Leave a reply</div>
		<div class="btn"><i></i>Continue with Google to comment</div>
		<div class="or">or</div>
		<div class="field tall"></div>
		<div class="field"></div>
	</div>
</div>
</body></html>
